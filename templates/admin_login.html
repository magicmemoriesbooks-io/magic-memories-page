<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Magic Memories Books</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            overflow: hidden;
            width: 100%;
            max-width: 380px;
        }
        .card-header {
            background: #333;
            color: white;
            text-align: center;
            padding: 28px 24px;
        }
        .card-header h4 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .card-header small { opacity: 0.7; font-size: 13px; }
        .card-body { padding: 28px 24px; }
        .error-box {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .locked-box {
            background: #1a1a1a;
            border: 2px solid #dc2626;
            color: #fca5a5;
            padding: 20px 16px;
            border-radius: 10px;
            font-size: 15px;
            text-align: center;
            line-height: 1.6;
        }
        .locked-box strong {
            display: block;
            font-size: 18px;
            color: #ef4444;
            margin-bottom: 8px;
        }
        label {
            display: block;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            font-size: 15px;
        }
        input[type="password"] {
            display: block;
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            color: #333;
            background: white;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }
        input[type="password"]:focus {
            border-color: #333;
        }
        button[type="submit"] {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            background: #333;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }
        button[type="submit"]:active { opacity: 0.85; }
        .card-footer {
            background: #f8f9fa;
            text-align: center;
            padding: 16px;
            border-top: 1px solid #eee;
        }
        .card-footer a {
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h4>Panel de Administración</h4>
            <small>Acceso privado</small>
        </div>
        <div class="card-body">
            {% if locked %}
            <div class="locked-box">
                <strong>🔒 Acceso bloqueado</strong>
                Se han superado 3 intentos fallidos.<br>
                Contacta con el desarrollador para desbloquear este acceso.
            </div>
            {% else %}
                {% if error %}
                <div class="error-box">{{ error }}</div>
                {% endif %}
                <form method="POST" action="{{ url_for('admin_login') }}">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password"
                           placeholder="Ingresa tu contraseña" required>
                    <button type="submit">Entrar</button>
                </form>
            {% endif %}
        </div>
        <div class="card-footer">
            <a href="{{ url_for('index') }}">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
